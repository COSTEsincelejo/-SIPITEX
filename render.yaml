# Blueprint de Render: web (Dockerfile) + PostgreSQL 16.
# Las variables con sync: false se completan en el panel al crear el Blueprint.
# No ponga secretos reales (SMTP, ADMIN_SEED_PASSWORD) en este archivo ni en git.
databases:
  - name: sipitex-db
    plan: starter
    databaseName: sipitex
    user: sipitex
    postgresMajorVersion: 16

services:
  - type: web
    name: sipitex
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: sipitex-db
          property: connectionString
      - key: Seed__DemoUsers
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: Email__Enabled
        sync: false
      - key: Email__User
        sync: false
      - key: Email__Password
        sync: false
      # Mismo buzón que Email__User. El From de appsettings es un marcador y Gmail lo rechaza.
      - key: Email__From
        sync: false
      - key: Costing__LaborHourRate
        sync: false
