name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sipitex
          POSTGRES_PASSWORD: sipitex
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sipitex -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SIPITEX_TEST_PG_HOST: localhost
      SIPITEX_TEST_PG_PORT: "5432"
      SIPITEX_TEST_PG_USER: sipitex
      SIPITEX_TEST_PG_PASSWORD: sipitex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sipitex.slnx

      - name: Build
        run: dotnet build Sipitex.slnx --configuration Release --no-restore

      - name: Check pending EF model changes
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            --project src/Sipitex.Infrastructure \
            --startup-project src/Sipitex.Web

      - name: Test
        run: dotnet test Sipitex.slnx --configuration Release --no-build --verbosity normal

  # Solo en push a main, y solo si build-and-test pasó. El hook no se imprime.
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL no está configurado. Se omite el deploy. Cree un Deploy Hook en Render y guárdelo como secret del repositorio."
            exit 0
          fi
          if ! curl -fsS -X POST -o /dev/null --retry 2 --retry-all-errors "$RENDER_DEPLOY_HOOK_URL" >/dev/null 2>&1; then
            echo "El Deploy Hook de Render respondió con error. Revise el secret y el servicio."
            exit 1
          fi
          echo "Deploy de Render solicitado."
