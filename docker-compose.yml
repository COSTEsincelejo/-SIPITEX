services:
  sipitex:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - sipitex-data:/app/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/sipitex.db"
    restart: unless-stopped

volumes:
  sipitex-data:
