services:
  db:
    image: postgres:16-alpine
    container_name: sipitex-postgres
    environment:
      POSTGRES_DB: sipitex
      POSTGRES_USER: sipitex
      POSTGRES_PASSWORD: sipitex
    ports:
      - "5432:5432"
    volumes:
      - sipitex-pgdata:/var/lib/postgresql/data
      - ./docs/database/postgres/01_init_roles.sql:/docker-entrypoint-initdb.d/01_init_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipitex -d sipitex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sipitex:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: PostgreSQL
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=sipitex;Username=sipitex;Password=sipitex"
      Email__User: "${EMAIL_SMTP_USER}"
      Email__Password: "${EMAIL_SMTP_PASSWORD}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  sipitex-pgdata:
